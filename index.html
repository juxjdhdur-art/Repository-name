<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#15161a"><title>مشغل الأغاني</title>
<style>
:root{--bg:#15161a;--panel:#23252b;--edge:#3a3d46;--txt:#e8e8ec;--acc:#ff9f1c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
body{padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0);max-width:520px;margin:auto}
.box{margin:14px 0;background:linear-gradient(#2c2e35,#1c1d22);border:2px solid var(--edge);border-radius:22px;padding:14px}
.screen{background:#0b1a12;border:2px solid #000;border-radius:12px;padding:10px;box-shadow:inset 0 0 14px #000}
#title{font-size:17px;color:#7dffb0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-bottom:8px}
#eq{display:flex;align-items:flex-end;gap:3px;height:70px;direction:ltr}
#eq i{flex:1;background:#7dffb0;border-radius:2px;height:6%;transition:height .09s}
.mid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}
.col{display:flex;flex-direction:column;gap:12px}
.btn{background:linear-gradient(#3b3e47,#26282e);color:var(--txt);border:1px solid #555;border-radius:12px;padding:14px 4px;font:600 15px inherit;box-shadow:0 3px 0 #000}
.btn:active,.btn.on{transform:translateY(2px);box-shadow:0 1px 0 #000;background:var(--acc);color:#111}
.knobwrap{text-align:center}
#knob{width:150px;height:150px;border-radius:50%;margin:auto;position:relative;touch-action:none;
background:radial-gradient(circle at 35% 30%,#e9ebef,#8b8f98 55%,#4a4d55);border:5px solid #111;box-shadow:0 6px 14px #000}
#knob b{position:absolute;left:50%;top:8px;width:6px;height:28px;margin-left:-3px;background:#d00;border-radius:3px}
#vol{margin-top:8px;color:var(--acc);font-weight:700}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #555;background:#111;color:var(--txt);font-size:16px}
.search .btn{padding:0 16px}
#hint{font-size:12px;color:#9aa;margin:8px 2px 0;line-height:1.6}
#res{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.it{display:flex;gap:8px;align-items:center;background:#1a1b20;border:1px solid #444;border-radius:10px;padding:6px;color:var(--txt);text-align:right;font:14px inherit;width:100%}
.it img{width:80px;height:45px;object-fit:cover;border-radius:6px}
.it span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#keyrow{margin-top:10px;display:flex;gap:8px}
#keyrow input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid #555;background:#111;color:var(--txt)}
#player{margin-top:12px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
#player iframe{width:100%;height:100%;border:0}
</style></head><body>
<div class="box">
 <div class="screen"><div id="title">اكتب اسم أغنية أو الصق رابط يوتيوب</div><div id="eq"></div></div>
 <div class="mid">
  <div class="col"><button class="btn on" data-m="system">سستم</button><button class="btn" data-m="rock">روك</button></div>
  <div class="knobwrap"><div id="knob"><b></b></div><div id="vol">الصوت 50</div></div>
  <div class="col"><button class="btn" data-m="jazz">جاز</button><button class="btn" data-m="beats">دقات ودبات</button></div>
 </div>
 <div class="search"><input id="q" placeholder="ابحث عن أغنية أو الصق رابط يوتيوب"><button class="btn" id="go">▶ تشغيل</button></div>
 <div id="keyrow"><input id="key" type="password" placeholder="مفتاح YouTube API (يُحفظ على جهازك)"><button class="btn" id="sk" style="padding:0 14px">حفظ</button></div>
 <div id="res"></div>
 <div id="player" hidden></div>
</div>
<script>
const eq=document.getElementById('eq');for(let i=0;i<28;i++)eq.appendChild(document.createElement('i'));
const bars=[...eq.children];
const modes={system:{c:'#7dffb0',s:1,a:.7},rock:{c:'#ff4d4d',s:1.6,a:1},jazz:{c:'#ffc857',s:.55,a:.55},beats:{c:'#5bc0ff',s:2.2,a:.95}};
let mode='system',playing=false,t=0;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 mode=b.dataset.m;bars.forEach(x=>x.style.background=modes[mode].c);document.getElementById('title').style.color=modes[mode].c});
setInterval(()=>{const m=modes[mode];t+=m.s*.35;
 bars.forEach((b,i)=>{const base=playing?(.35+.65*Math.abs(Math.sin(t+i*.5)))*(.5+Math.random()*.5)*m.a:.05+.03*Math.sin(t+i);
  b.style.height=Math.max(4,base*100)+'%'})},90);
// knob
const knob=document.getElementById('knob'),volT=document.getElementById('vol');let vol=50;
function setVol(v){vol=Math.max(0,Math.min(100,v));knob.style.transform=`rotate(${-135+vol*2.7}deg)`;volT.textContent='الصوت '+Math.round(vol);
 const f=document.querySelector('#player iframe');
 if(f)f.contentWindow.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[Math.round(vol)]}),'*')}
setVol(50);
let drag=false;
function ang(e){const r=knob.getBoundingClientRect();let a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90;if(a>180)a-=360;
 a=Math.max(-135,Math.min(135,a));setVol((a+135)/2.7)}
knob.addEventListener('pointerdown',e=>{drag=true;knob.setPointerCapture(e.pointerId);ang(e)});
knob.addEventListener('pointermove',e=>{if(drag)ang(e)});
knob.addEventListener('pointerup',()=>drag=false);
// play
function ytId(s){const m=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]}
let KEY='';try{KEY=localStorage.getItem('ytk')||''}catch(e){}
const keyEl=document.getElementById('key');if(KEY)keyEl.value='••••••••';
document.getElementById('sk').onclick=()=>{const v=keyEl.value.trim();if(!v||v.startsWith('•'))return;KEY=v;try{localStorage.setItem('ytk',v)}catch(e){}keyEl.value='••••••••';document.getElementById('title').textContent='تم حفظ المفتاح'};
function play(id,name){
 const T=document.getElementById('title');T.textContent='▶ '+name;playing=true;
 if(location.protocol.startsWith('http')){
  const p=document.getElementById('player');p.hidden=false;
  p.innerHTML=`<iframe allow="autoplay; encrypted-media; fullscreen" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&playsinline=1"></iframe>`;
  setTimeout(()=>setVol(vol),1500)}
 else{location.href='https://www.youtube.com/watch?v='+id}}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
document.getElementById('go').onclick=async()=>{
 const q=document.getElementById('q').value.trim(),T=document.getElementById('title'),R=document.getElementById('res');if(!q)return;
 const id=ytId(q);if(id){play(id,'مقطع يوتيوب');return}
 if(!KEY){T.textContent='أدخل مفتاح API أولاً';return}
 T.textContent='جاري البحث...';R.innerHTML='';
 try{const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(KEY));
  const d=await r.json();if(d.error){T.textContent='خطأ: '+d.error.message.slice(0,60);return}
  T.textContent='اختر أغنية من النتائج';
  d.items.forEach(v=>{const b=document.createElement('button');b.className='it';
   const th=v.snippet.thumbnails.default.url,ti=v.snippet.title;
   b.innerHTML=`<img src="${th}" alt=""><span>${esc(ti)}</span>`;
   b.onclick=()=>{const t=document.createElement('textarea');t.innerHTML=ti;play(v.id.videoId,t.value);R.innerHTML=''};R.appendChild(b)})}
 catch(e){T.textContent='تعذّر الاتصال. افتح الملف من كروم وتأكد من الإنترنت'}};
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
